name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install linting
        run: pip install black flake8

      - name: Lint Python files
        run: |
          black --check --diff tests benchmarks
          flake8 tests benchmarks --max-line-length=100 --ignore=E501,W503

      - name: Verify project structure
        run: |
          test -f README.md
          test -f LICENSE
          test -f CONTRIBUTING.md
          test -f CODE_OF_CONDUCT.md
          test -f .gitignore
          test -f Makefile
          test -f setup.py
          echo "All required files present"

      - name: Verify header files
        run: |
          test -f include/tensor.h
          test -f include/layers.h
          test -f include/model.h
          test -f include/kernels.cuh
          echo "All header files present"

      - name: Verify source files
        run: |
          test -f src/tensor.cpp
          test -f src/layers.cpp
          test -f src/optimizers.cpp
          test -f src/kernels.cu
          echo "All source files present"

      - name: Verify tests
        run: |
          test -f tests/test_engine.py
          test -f benchmarks/benchmark.py
          echo "Test and benchmark files present"

      - name: Verify GitHub config
        run: |
          test -f .github/workflows/ci.yml
          test -f .github/ISSUE_TEMPLATE/bug_report.md
          test -f .github/ISSUE_TEMPLATE/feature_request.md
          test -f .github/PULL_REQUEST_TEMPLATE.md
          echo "GitHub templates present"
